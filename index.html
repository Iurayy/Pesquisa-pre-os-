<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Advisor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-title">
        <span class="badge">IA Hardware</span>
        <h1>Meu Setup</h1>
      </div>
      <div class="budget-card">
        <label>Orçamento Teto</label>
        <div class="budget-input-wrap">
          <span>R$</span>
          <input type="number" id="totalBudget" value="6000" step="100">
        </div>
      </div>
    </header>

    <section class="folder-section">
      <label>Nome da Pasta / Projeto</label>
      <input type="text" id="folderName" value="PC Gamer Ryzen AM5">
    </section>

    <section class="items-section">
      <div class="section-header">
        <h2>Componentes</h2>
        <span id="itemCount">0 itens</span>
      </div>

      <div class="add-item-bar">
        <input type="text" id="itemCategory" placeholder="Categoria (ex: GPU, CPU, RAM)">
        <input type="text" id="itemSpec" placeholder="Modelo ou especificação desejada">
        <button id="addItemBtn" type="button">+</button>
      </div>

      <ul id="itemsList" class="items-list"></ul>
    </section>

    <section class="actions-section">
      <label class="toggle-telegram">
        <input type="checkbox" id="notifyTelegram" checked>
        <span>Enviar cópia para o Telegram</span>
      </label>
      <button id="analyzeBtn" class="primary-btn">
        <span class="btn-text">Consultar Preços com IA</span>
        <span class="spinner" id="btnSpinner"></span>
      </button>
    </section>

    <section id="resultSection" class="result-section hidden">
      <h2>Veredito da Consultoria</h2>
      <div id="resultContent" class="result-content"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
